<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa243c"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#fa243c" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- App Background Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#pulseGlow)" stroke-width="4" opacity="0.3"/>
  
  <!-- Dynamic Pulse Soundwave Graphic -->
  <g filter="url(#shadow)">
    <!-- Equalizer Waves -->
    <path d="M 120 256 L 160 256 L 180 180 L 210 330 L 240 130 L 270 380 L 300 170 L 330 310 L 350 256 L 392 256" 
          fill="none" 
          stroke="url(#pulseGlow)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Central Pulse Dot -->
  <circle cx="270" cy="380" r="10" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="240" cy="130" r="8" fill="#ffffff" filter="url(#shadow)"/>
</svg>

